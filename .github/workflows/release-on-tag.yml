name: Release to WordPress.org

# Publishing a GitHub Release ships it to WordPress.org: build the zip, write it to SVN
# tags/<tag>, then point trunk's Stable tag at it so WordPress.org serves it as the update.
# Pre-releases skip all of it. workflow_dispatch re-runs a release by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destination_tag:
        description: 'The tag version to release (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  # Job to determine the previous tag
  find-previous-tag:
    name: Find Previous Tag
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.get_previous_tag.outputs.previous_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Need full history for tags
      
      - name: Get previous tag
        id: get_previous_tag
        run: |
          # Get current tag (either from actual tag or from input)
          CURRENT_TAG="${{ github.event.inputs.destination_tag || github.ref_name }}"
          echo "Current tag: $CURRENT_TAG"
          
          # Get all tags sorted by version
          ALL_TAGS=$(git tag -l --sort=-v:refname)
          echo "All tags: $ALL_TAGS"
          
          # Find the tag that comes before the current one
          PREVIOUS_TAG=""
          FOUND_CURRENT=false
          
          # Find the tag that comes before the current one (for both manual dispatch and tag push)
          for tag in $ALL_TAGS; do
            if [ "$tag" == "$CURRENT_TAG" ]; then
              FOUND_CURRENT=true
            elif [ "$FOUND_CURRENT" == "true" ]; then
              PREVIOUS_TAG="$tag"
              break
            fi
          done
          
          # If no previous tag found, fall back to trunk
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="trunk"
            echo "No previous tag found, using trunk"
          else
            echo "Previous tag: $PREVIOUS_TAG"
          fi
          
          # Set output
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

  # First job - build the ZIP file using the existing zip.yml workflow
  build:
    name: Build Plugin Package
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    uses: ./.github/workflows/zip.yml
    with:
      production: true

  # Second job - release to WordPress.org SVN using the existing release-svn.yml workflow
  release:
    name: Release to WordPress.org SVN
    needs: [build, find-previous-tag]
    uses: ./.github/workflows/release-svn.yml
    with:
      source_tag: ${{ needs.find-previous-tag.outputs.previous_tag }}
      destination_tag: ${{ github.event.inputs.destination_tag || github.ref_name }}
      artifact_name: ${{ needs.build.outputs.zip_name }}
    secrets: inherit

  # Last job - point trunk's Stable tag at the new tag, which is what makes WordPress.org offer it
  stable-tag:
    name: Set Stable Tag on SVN trunk
    needs: release
    runs-on: ubuntu-latest
    env:
      SVN_URL: https://plugins.svn.wordpress.org/fakerpress
      TAG: ${{ github.event.inputs.destination_tag || github.ref_name }}
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - name: Setup SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Check the SVN tag
        run: |
          # Only point trunk at a tag that exists and carries this version.
          svn cat --non-interactive "$SVN_URL/tags/$TAG/fakerpress.php" | grep -Eq "^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*${TAG}[[:space:]]*$" || {
            echo "::error::tags/$TAG/fakerpress.php is missing or not Version: $TAG"
            exit 1
          }

      - name: Update trunk readme.txt
        run: |
          svn co --non-interactive --depth empty "$SVN_URL" svn
          cd svn
          svn up --non-interactive --depth empty trunk
          svn up --non-interactive trunk/readme.txt

          CURRENT=$(sed -n 's/^Stable tag:[[:space:]]*//p' trunk/readme.txt | tr -d '[:space:]')
          echo "Trunk Stable tag: $CURRENT"
          if [ "$CURRENT" == "$TAG" ]; then
            echo "Already $TAG, nothing to commit"
            echo "## Stable tag already \`$TAG\` :white_check_mark:" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sed -i -E "s/^(Stable tag:[[:space:]]*).*/\1$TAG/" trunk/readme.txt
          svn diff trunk/readme.txt
          svn ci trunk/readme.txt -m "Stable tag $TAG" --non-interactive --no-auth-cache --username "$SVN_USERNAME" --password "$SVN_PASSWORD"

          echo "## Stable tag \`$CURRENT\` → \`$TAG\` :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "WordPress.org now offers $TAG: https://wordpress.org/plugins/fakerpress/" >> "$GITHUB_STEP_SUMMARY"
